insmod all_video
insmod gfxterm
insmod iso9660
insmod part_gpt
insmod part_msdos
insmod fat
insmod search

set default=0
set timeout=5
set timeout_style=menu

# Find the partition containing our live system
search --no-floppy --set=root --file /live/vmlinuz

menuentry "Gershwin on Devuan" {
    linux /live/vmlinuz boot=live
    initrd /live/initrd.img
}

menuentry "Gershwin on Devuan (verbose)" {
    linux /live/vmlinuz boot=live loglevel=7
    initrd /live/initrd.img
}

# Escape hatch for NVIDIA GPUs the driver cannot drive. The 550 series supports
# Maxwell (GTX 745 / 9xx) and newer; on a Kepler or older card nvidia.ko never
# binds and the screen stays blank, and the modprobe.d blacklist the nvidia
# packages install means nouveau will not step in either. Blacklisting the
# modules hands the display to the generic framebuffer instead. Unlike the
# fail-safe entry below this keeps KMS and SMP, so it is a usable desktop rather
# than a rescue mode. "nvidia" is the alias udev resolves the GPU's modalias to;
# the nvidia-current-* names are the renamed modules it pulls in (see the
# modprobe.d note in build.sh).
menuentry "Gershwin on Devuan (disable NVIDIA driver)" {
    linux /live/vmlinuz boot=live modprobe.blacklist=nvidia,nvidia-current,nvidia-current-modeset,nvidia-current-drm,nvidia-current-uvm
    initrd /live/initrd.img
}

menuentry "Gershwin on Devuan (fail-safe)" {
    linux /live/vmlinuz boot=live memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
    initrd /live/initrd.img
}
