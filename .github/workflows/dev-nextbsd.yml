name: dev-nextbsd

# Reference flavor for the monorepo: build -> gate -> publish, on EVERY run.
# The build is the only flavor-specific bit (inline, in a FreeBSD VM). Everything
# else is the shared layer every flavor calls: free-disk, screenshot-gate (boot
# + greeter login + desktop-render check, init-agnostic), publish-continuous.
#
# Trigger: this flavor's target (targets/nextbsd/**) or shared actions (.github/actions/**);
# README and other top-level files never build. There is NO "reuse the last ISO"
# fast path — the gate always boots the ISO this run just built, so it can never
# test an image that doesn't exist.

on:
  push:
    branches: [main]
    paths: ['targets/nextbsd/**', '.github/actions/**', '.github/workflows/dev-nextbsd.yml']
  pull_request:
    paths: ['targets/nextbsd/**', '.github/actions/**', '.github/workflows/dev-nextbsd.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (nextbsd ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            vm_arch: x86_64
          # Built on a native arm64 runner so the FreeBSD aarch64 guest gets KVM.
          # vmactions' README recommends staying on ubuntu-latest and emulating,
          # but that advice predates free arm64 runners and costs a TCG-emulated
          # world build here -- which does not fit in 240 minutes.
          - arch: arm64
            runner: ubuntu-24.04-arm
            vm_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk

      - name: Resolve gershwin-developer ref (dev if it exists, else main)
        id: gd
        run: |
          if git ls-remote --exit-code --heads https://github.com/gershwin-desktop/gershwin-developer.git dev >/dev/null 2>&1; then
            echo "ref=dev" >> "$GITHUB_OUTPUT"; echo "gershwin-developer: using dev branch"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"; echo "gershwin-developer: no dev branch — using main"
          fi

      - name: Build ISO inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: ${{ matrix.vm_arch }}
          usesh: true
          sync: rsync
          copyback: true
          cpu: 4
          mem: 8192
          prepare: |
            pkg install -y git
          run: |
            set -e
            export TARGET_ARCH=${{ matrix.arch }}
            export CHANNEL=dev
            export GERSHWIN_REF=${{ steps.gd.outputs.ref }}
            export GERSHWIN_BRANCH=dev
            /bin/sh ./targets/nextbsd/build.sh
            ls -lh /usr/local/gon-build/iso/
            mkdir -p out
            cp /usr/local/gon-build/iso/*.iso out/

      - uses: actions/upload-artifact@v4
        with:
          name: gershwin-nextbsd-${{ matrix.arch }}
          path: out
          retention-days: 1
          if-no-files-found: error

  test:
    name: boot + login + screenshot (nextbsd ${{ matrix.arch }})
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            suffix: ''
          # Native arm64 runner: the gate boots a whole desktop, and under TCG
          # that does not finish inside timeout-minutes.
          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: '-arm64'
    steps:
      - uses: actions/checkout@v4

      - name: Download fresh build artifact
        uses: actions/download-artifact@v4
        with:
          name: gershwin-nextbsd-${{ matrix.arch }}
          path: artifacts

      # The whole boot -> greeter -> admin login -> desktop-render gate lives in
      # the shared action. It observes the Gershwin greeter/desktop from outside
      # the guest, so it is identical for every flavor (init-agnostic). A failure
      # here fails the job and blocks publish (needs.test.result == 'success').
      - uses: ./.github/actions/screenshot-gate
        with:
          flavor: nextbsd
          iso-dir: artifacts
          arch: ${{ matrix.arch }}
          artifact-suffix: ${{ matrix.suffix }}
          soft-fail: true

  publish:
    name: publish nextbsd-dev
    # Public release is gated on boot + login + screenshot all passing.
    needs: [build, test]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ISOs (both arches)
        uses: actions/download-artifact@v4
        with:
          pattern: gershwin-nextbsd-*
          merge-multiple: true
          path: dist

      - name: Download screenshot
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          # amd64's frame only -- both arches emit the same filename, so this is
          # a deliberate pick rather than a merge. arm64's frame stays in its own
          # artifact as gate evidence.
          name: desktop-screenshot
          path: screenshot

      - uses: ./.github/actions/publish-continuous
        with:
          tag: nextbsd-dev
          title: NextBSD (dev)
          assets-dir: dist
          screenshot: screenshot/gershwin-on-nextbsd.png
          token: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: purge run ISO artifact
    needs: [build, test, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete this run's ISO/screenshot artifacts (job-handoff only; ISO is on the release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("boot-artifacts") | not) | .id' \
          | while read -r id; do
              gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" \
                && echo "deleted artifact $id"
            done
